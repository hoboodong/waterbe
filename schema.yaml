version: "4.0"
description: 워터비 운영 두뇌 데이터 구조. Supabase가 수집·저장하고 워터비가 연결·분석한다.

source_of_truth: Supabase

classes:
  Store:
    fields: [id, name]

  AppProduct:
    description: 앱에서 매장별로 생성한 판매상품
    fields: [storeId, appProductId, martCode, name, price, active]
    unique: [storeId, appProductId]

  AppIngredient:
    description: 앱에서 매장별로 생성한 원재료
    fields: [storeId, appIngredientId, name, unit, active]
    unique: [storeId, appIngredientId]

  AppRecipe:
    description: 앱 레시피와 적용 이력
    fields: [storeId, appRecipeId, appProductId, effectiveFrom, effectiveTo, materials]

  ProductionDaily:
    description: 앱의 일자별 생산계획·실제생산 기록
    fields: [date, storeId, appProductId, plannedQty, actualQty, wasteQty, memo]

  DiscountLabel:
    description: 앱 할인라벨 출력 기록. 판매 확정값이 아닌 운영 참고값
    fields: [date, storeId, appProductId, discountRate, quantity]

  SalesDaily:
    description: 매출 원본의 코드별 일일 판매 기록
    fields: [date, storeId, martCode, quantity, amount]

  Purchase:
    description: 남선푸드 메인발주와 기타 업체 발주·입고
    fields: [date, storeId, type, vendor, purchaseSpecId, appIngredientId, quantity, amount]

  Expense:
    description: 비품 구매와 신용카드 등 일반 지출
    fields: [date, storeId, type, vendor, paymentMethod, amount, memo]

  InventoryCount:
    description: 주기적으로 수행하는 원재료 재고실사
    fields: [date, storeId, appIngredientId, quantity, unit]

  Staff:
    fields: [id, name, storeId, role]

  Schedule:
    fields: [date, storeId, staffId, type, title]

analytics:
  daily: [salesRate, averageSellingPrice, estimatedUnsoldQty, discountLabelRate]
  weekly: [productSalesTrend, purchaseNeed]
  monthly: [sales, cost, expenses, labor, margin]
  yearly: [storeTrend, productTrend, vendorTrend, seasonality]
