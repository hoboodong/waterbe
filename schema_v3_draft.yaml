version: "3.0-draft"
description: 워터비 단순 운영 스키마 초안

classes:
  Store:
    label: 매장
    fields:
      name: {type: string, required: true}
      branch: {type: string, required: false}
      location: {type: string, required: false}

  Item:
    label: 판매상품
    description: 매장과 무관한 공통 상품명
    fields:
      name: {type: string, required: true}
      kind:
        type: enum
        values: [meal_kit, seafood, marinated_crab, other]
        required: false
      salesUnit: {type: string, required: false}
      active: {type: boolean, required: false, default: true}

  StoreItem:
    label: 매장판매상품
    description: 특정 매장에서 판매되는 상품과 판매 조건
    fields:
      storeId: {type: ref, target: Store, required: true}
      itemId: {type: ref, target: Item, required: true}
      displayName: {type: string, required: false}
      martCode: {type: string, required: false}
      price: {type: number, required: false, nullable: true}
      effectiveFrom: {type: date, required: false}
      effectiveTo: {type: date, required: false, nullable: true}
      active: {type: boolean, required: false, default: true}
    constraints:
      - "storeId + itemId + effectiveFrom 조합은 유일"

  Material:
    label: 자재
    description: 원재료, 포장재, 소모품의 내부 기준명
    fields:
      name: {type: string, required: true}
      type:
        type: enum
        values: [ingredient, packaging, supply]
        required: true
      origin: {type: string, required: false}
      defaultUnit: {type: string, required: false}
      thawLossRate: {type: number, required: false, nullable: true}
      trimLossRate: {type: number, required: false, nullable: true}

  PurchaseItem:
    label: 발주품목
    description: 업체에 발주하는 실제 규격
    fields:
      materialId: {type: ref, target: Material, required: false, nullable: true}
      vendorName: {type: string, required: false, nullable: true}
      orderName: {type: string, required: true}
      orderUnit: {type: string, required: true}
      category:
        type: enum
        values: [ingredient, packaging, supply]
        required: true
      packCount: {type: number, required: false, nullable: true}
      countPerKg: {type: number, required: false, nullable: true}
      active: {type: boolean, required: false, default: true}

  PurchasePrice:
    label: 발주단가이력
    fields:
      purchaseItemId: {type: ref, target: PurchaseItem, required: true}
      date: {type: date, required: true}
      unitPrice: {type: number, required: true}
      deliveryFee: {type: number, required: false, nullable: true}
      memo: {type: string, required: false, nullable: true}

  BillOfMaterials:
    label: 제품구성
    description: 매장판매상품 1개 생산에 필요한 자재 목록
    fields:
      storeItemId: {type: ref, target: StoreItem, required: true}
      effectiveFrom: {type: date, required: false}
      effectiveTo: {type: date, required: false, nullable: true}
      lines:
        type: list
        required: true
        item:
          materialId: {type: ref, target: Material, required: true}
          quantity: {type: number, required: true}
          unit: {type: string, required: true}
          purchaseItemId: {type: ref, target: PurchaseItem, required: false, nullable: true}

  ProductionRule:
    label: 기본생산량
    fields:
      storeItemId: {type: ref, target: StoreItem, required: true}
      dailyQty: {type: object, required: true}
      unit: {type: string, required: false, default: 개}
      effectiveFrom: {type: date, required: true}
      effectiveTo: {type: date, required: false, nullable: true}
      memo: {type: string, required: false, nullable: true}

  ProductionWeek:
    label: 주간생산계획
    fields:
      storeItemId: {type: ref, target: StoreItem, required: true}
      weekStart: {type: date, required: true}
      planned: {type: object, required: true}
      adjusted: {type: object, required: false, nullable: true}
      actual: {type: object, required: false, nullable: true}
      status:
        type: enum
        values: [planned, in_progress, completed]
        required: true
      memo: {type: string, required: false, nullable: true}

  StockCount:
    label: 재고실사
    fields:
      storeId: {type: ref, target: Store, required: true}
      materialId: {type: ref, target: Material, required: true}
      purchaseItemId: {type: ref, target: PurchaseItem, required: false, nullable: true}
      date: {type: date, required: true}
      quantity: {type: number, required: true}
      unit: {type: string, required: true}
      boxes: {type: number, required: false, nullable: true}
      openRemainder: {type: number, required: false, nullable: true}
      memo: {type: string, required: false, nullable: true}

  PurchaseReceipt:
    label: 입고기록
    fields:
      storeId: {type: ref, target: Store, required: true}
      purchaseItemId: {type: ref, target: PurchaseItem, required: true}
      date: {type: date, required: true}
      quantity: {type: number, required: true}
      unit: {type: string, required: true}
      memo: {type: string, required: false, nullable: true}

  SalesDaily:
    label: 일별판매
    fields:
      storeItemId: {type: ref, target: StoreItem, required: true}
      date: {type: date, required: true}
      quantity: {type: number, required: true}
      unitPrice: {type: number, required: false, nullable: true}
      amount: {type: number, required: true}
      source: {type: string, required: false}
      memo: {type: string, required: false, nullable: true}

  Staff:
    label: 직원
    fields:
      name: {type: string, required: true}
      telegramId: {type: string, required: true}
      role:
        type: enum
        values: [팀장, 직원]
        required: true
      storeId: {type: ref, target: Store, required: false, nullable: true}

  CalendarEvent:
    label: 일정
    fields:
      storeId: {type: ref, target: Store, required: true}
      date: {type: date, required: true}
      endDate: {type: date, required: false, nullable: true}
      type:
        type: enum
        values: [근무, 기타]
        required: true
      title: {type: string, required: true}
      description: {type: string, required: false, nullable: true}
      assignee: {type: string, required: false, nullable: true}
      createdBy: {type: string, required: false, nullable: true}

migration:
  Product: Item
  Recipe: [StoreItem, BillOfMaterials]
  Ingredient: Material
  PurchaseSpec: PurchaseItem
  PriceHistory: PurchasePrice
  ProductionTemplate: ProductionRule
  ProductionPlan: ProductionWeek
  InventorySnapshot: StockCount
  InboundRecord: PurchaseReceipt
  SalesRecord: SalesDaily
  Schedule: CalendarEvent
